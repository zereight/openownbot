name: Release

# A tag such as `oob-0.52.0-1` builds unsigned packages and creates a DRAFT release. Nothing here
# publishes: a person looks at the draft and publishes it by hand (docs/RELEASING-FORK.md).
on:
  push:
    tags: ["oob-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag form and a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^oob-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "The tag '$TAG' must look like oob-0.52.0-1." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not on main." >&2
            exit 1
          fi

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Require the local-only switch
        run: |
          grep -q '"localOnly": *true' packages/contracts/src/local-only.json
          bun run check:local-only

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
            dist: dist:mac
            verify: verify:package
            files: "*.dmg *.zip"
          - label: Windows
            os: windows-2025
            dist: dist:win
            verify: verify:package:win
            files: "*.exe"
          - label: Linux
            os: ubuntu-24.04
            dist: dist:linux
            verify: verify:package:linux
            files: "*.AppImage"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Build the unsigned package
        shell: bash
        run: bun run ${{ matrix.dist }}

      - name: Verify the package
        shell: bash
        run: bun run ${{ matrix.verify }}

      - name: Name the files after the release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          FILES: ${{ matrix.files }}
        run: |
          version=$(node -p "require('./package.json').version")
          release="${TAG#oob-}"
          mkdir -p release
          cd dist
          shopt -s nullglob
          for pattern in $FILES; do
            for f in $pattern; do
              case "$f" in
                *"-$version-"*) suffix="${f#*-$version-}" ;;
                *) suffix="${f#*-$version}" ; suffix="${suffix#-}" ;;
              esac
              cp "$f" "../release/ROBot-$release-$suffix"
            done
          done
          ls -l ../release
          if [ -z "$(ls -A ../release)" ]; then echo "No package was found in dist/." >&2; exit 1; fi

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create the draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Write the checksums and create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd assets
          sha256sum ROBot-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          notes="docs/release-notes/$TAG.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--notes "Draft. Release notes are not written yet."); fi
          gh release create "$TAG" --draft --verify-tag \
            --title "ROBot ${TAG#oob-}" "${notes_args[@]}" \
            assets/*
