name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Check that no request goes to the original project's servers
        run: bun run check:local-only

      - name: Check the UI foundation
        run: bun run check:ui

      - name: Type check
        run: |
          bun run typecheck:node
          bun run typecheck:renderer
          bun run typecheck:i18n
          bun run typecheck:contracts

      - name: Test
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"
        run: bunx vitest run
