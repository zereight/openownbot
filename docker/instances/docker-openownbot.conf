# Docker starts the OpenOwnBot containers when it starts. `openownbot-instance setup` installs this file as
# /etc/systemd/system/docker.service.d/openownbot.conf.
[Unit]
# No container starts without its firewall: when openownbot-firewall fails, Docker does not start.
Requires=openownbot-firewall.service
After=openownbot-firewall.service
# A container with the syslog log driver does not start without the rsyslog socket.
Wants=rsyslog.service
After=rsyslog.service
# A container with the LXCFS files of lxcfs.yaml does not start before LXCFS mounts them.
Wants=lxcfs.service
After=lxcfs.service
