# The container logs of the OpenOwnBot instances. `openownbot-instance setup` installs it as
# /etc/rsyslog.d/30-openownbot-docker.conf. See docs/docker.md#several-instances-on-one-host.
#
# Docker sends them to this socket and not to /dev/log, so they stay out of the journal and
# /var/log/syslog, whose size limits other services share. The AppArmor profile of rsyslogd permits a
# socket at /var/lib/*/dev/log. openownbot-logrotate keeps the files for 30 days.
template(name="OpenownbotDockerFile" type="string" string="/var/log/openownbot/%programname%.log")
template(name="OpenownbotDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="openownbot-docker") {
  # The tag is the container name, which openownbot-instance gives.
  if $programname startswith "openownbot-" then {
    # setup makes /var/log/openownbot for syslog, the user of rsyslogd.
    action(type="omfile" dynaFile="OpenownbotDockerFile" template="OpenownbotDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/openownbot-docker/dev/log" ruleset="openownbot-docker" createPath="off")
